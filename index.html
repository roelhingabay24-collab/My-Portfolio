    <script>
      // Resolve the theme before first paint so dark-mode users never see a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('rh-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
